name: Atualizar dashboard

# A cada 30 min (o GitHub pode atrasar alguns minutos nos horários cheios) e sob demanda pelo botão
# "Atualizar agora" do dashboard. Logs deste repositório são PÚBLICOS: o script não imprime dados.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write      # só para o commit de manutenção (keepalive)
  pages: write
  id-token: write
  actions: read

concurrency:
  group: atualizar-dashboard
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20

      # Cache incremental da coleta, guardado CIFRADO (contém nomes de leads).
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: cache
          key: dash-${{ github.run_id }}
          restore-keys: dash-

      - name: Coletar Pipedrive + Meta Ads + Kiwify e gerar o site
        env:
          PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
          PAINEL_SENHA: ${{ secrets.PAINEL_SENHA }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          KIWIFY_CLIENT_ID: ${{ secrets.KIWIFY_CLIENT_ID }}
          KIWIFY_CLIENT_SECRET: ${{ secrets.KIWIFY_CLIENT_SECRET }}
          KIWIFY_ACCOUNT_ID: ${{ secrets.KIWIFY_ACCOUNT_ID }}
          TZ: America/Sao_Paulo
        run: python3 painel.py ci

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        if: always()
        with:
          path: cache
          key: dash-${{ github.run_id }}

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4

      # O GitHub desliga agendamentos de repositório público após 60 dias sem commit.
      - name: Manter o agendamento ativo
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "MarketingMPI"
            git config user.email "MarketingMPI@users.noreply.github.com"
            git commit --allow-empty -m "Manutenção: mantém o agendamento ativo"
            git push
          fi

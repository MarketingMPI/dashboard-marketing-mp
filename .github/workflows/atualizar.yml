name: Atualizar dashboard

# A cada 30 min (o GitHub pode atrasar alguns minutos nos horários cheios) e sob demanda pelo botão
# "Atualizar agora" do dashboard. Logs deste repositório são PÚBLICOS: o script não imprime dados.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write      # só para o commit de manutenção (keepalive)
  pages: write
  id-token: write
  actions: read

concurrency:
  group: atualizar-dashboard
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Cache incremental da coleta, guardado CIFRADO (contém nomes de leads).
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: dash-${{ github.run_id }}
          restore-keys: dash-

      - name: Coletar Pipedrive + Meta Ads e gerar o site
        env:
          PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
          PAINEL_SENHA: ${{ secrets.PAINEL_SENHA }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          TZ: America/Sao_Paulo
        run: python3 painel.py ci

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: cache
          key: dash-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      # O GitHub desliga agendamentos de repositório público após 60 dias sem commit.
      - name: Manter o agendamento ativo
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "MarketingMPI"
            git config user.email "MarketingMPI@users.noreply.github.com"
            git commit --allow-empty -m "Manutenção: mantém o agendamento ativo"
            git push
          fi
